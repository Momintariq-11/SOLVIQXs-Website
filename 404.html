<style>

  p.sub { margin: 0 auto 36px; max-width: 520px; font-size: 18px; line-height: 1.6; color: rgba(248,248,248,.72); }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }

  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }

  @media (max-width: 600px) { .bar .btn { padding: 10px 16px; font-size: 14px; } .bar img { height: 17px; } }
